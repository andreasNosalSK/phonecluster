[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phonecluster"
version = "0.1.0"
description = "Turn Android phones into one unified Linux computer (Termux & Debian 13 ARM64) with an accessible Web Control Center."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
phonecluster = "phonecluster.cli:main"
pc = "phonecluster.cli:main"

[tool.setuptools.packages.find]
include = ["phonecluster*"]
