name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check shell scripts
        run: |
          for script in install.sh scripts/*.sh; do
            bash -n "$script"
          done
      - name: Run unittest suite
        run: python3 -W error -m unittest discover -s tests -v
      - name: Smoke-test the installed wheel
        if: matrix.python-version == '3.12'
        run: |
          python3 -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python3 -m venv "$RUNNER_TEMP/pc-venv"
          "$RUNNER_TEMP/pc-venv/bin/pip" install --no-index "$RUNNER_TEMP"/wheels/*.whl
          python3 tests/smoke_wheel.py "$RUNNER_TEMP/pc-venv/bin/pc"
